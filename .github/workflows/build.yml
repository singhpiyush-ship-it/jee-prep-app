name: Build JEE APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.2'
          channel: 'stable'

      - name: Create Clean Flutter Project & Copy Code
        run: |
          mkdir -p temp_backup
          cp -r lib temp_backup/
          cp pubspec.yaml temp_backup/
          
          flutter create temp_project --org com.jeeprep --project-name jee_prep_app --platforms android
          
          cd temp_project
          rm -rf lib pubspec.yaml
          cp -r ../temp_backup/lib ./
          cp ../temp_backup/pubspec.yaml ./
          
          cd ..
          shopt -s dotglob
          cp -r temp_project/* ./
          rm -rf temp_project temp_backup

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --verbose

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          
